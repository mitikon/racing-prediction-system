name: Racing maintenance RSI guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test environment
        run: python -m pip install '.[test]'
      - name: Run racing maintenance-only RSI audit
        run: racing-maintenance-rsi-audit --root . --output artifacts/racing-maintenance-rsi/report.json
      - name: Run complete racing regression suite
        run: python -m pytest -q
      - name: Upload write-once audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: racing-maintenance-rsi-${{ github.run_id }}
          path: artifacts/racing-maintenance-rsi
          if-no-files-found: warn
          retention-days: 90

  dependency-vulnerability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security audit environment
        run: python -m pip install '.[security]'
      - name: Audit Python dependencies
        run: python -m pip_audit
