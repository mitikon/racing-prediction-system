name: Racing lambda tests

on:
  push:
    branches: [main]
    paths:
      - "src/racing_lambda/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/racing_lambda/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/racing-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'
      - name: Run complete racing regression suite
        run: python -m pytest -q tests
