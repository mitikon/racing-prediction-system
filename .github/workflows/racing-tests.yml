name: Racing lambda tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/racing_lambda/**"
      - "tests/test_racing*.py"
      - "tests/test_simple_leading_signal_v02.py"
      - "pyproject.toml"
      - ".github/workflows/racing-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'
      - name: Run complete racing regression suite
        run: python -m pytest -q tests/test_racing*.py tests/test_simple_leading_signal_v02.py
