name: RSI recursive learning loop

on:
  workflow_dispatch:
    inputs:
      command:
        description: "freeze or settle"
        required: true
        type: choice
        options: [freeze, settle]
      prediction_file:
        description: "Repository path to normalized prediction JSON"
        required: true
        type: string
      result_file:
        description: "Repository path to official result JSON (settle only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: racing-rsi-learning-loop
  cancel-in-progress: false

jobs:
  run-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Pull latest data safely
        run: git pull --ff-only origin main
      - name: Freeze PRE_RACE
        if: inputs.command == 'freeze'
        run: racing-rsi-loop --root data/automated_loop freeze "${{ inputs.prediction_file }}"
      - name: Settle and generate RSI feedback
        if: inputs.command == 'settle'
        run: racing-rsi-loop --root data/automated_loop settle "${{ inputs.prediction_file }}" "${{ inputs.result_file }}"
      - name: Commit append-only records
        run: |
          git config user.name "racing-rsi-bot"
          git config user.email "racing-rsi-bot@users.noreply.github.com"
          git add data/automated_loop
          git diff --cached --quiet && exit 0
          git commit -m "data: append racing RSI loop evidence"
          git push origin HEAD:main
