[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-prediction-system"
version = "0.1.0"
description = "Auditable horse-racing prediction system"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
racing-lambda-backtest = "racing_lambda.backtest:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
